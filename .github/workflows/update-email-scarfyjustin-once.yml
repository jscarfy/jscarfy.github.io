name: One-time email update

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace email addresses across site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          new_email = 'scarfyjustin (at) gmail (dot) com'
          replacements = {
              'justinscarfy@gmail.com': new_email,
              'justinscarfy (at) gmail (dot) com': new_email,
              'scarfyjustin@gmail.com': new_email,
              'pujustinscarfyyang (at) icloud (dot) com': new_email,
              'pujustinscarfyyang@icloud.com': new_email,
              'pujustunscarfyyang@icloud.com': new_email,
              'pujustunscarfyyang (at) icloud (dot) com': new_email,
          }

          suffixes = {'.html', '.htm', '.css', '.js', '.txt', '.md', '.xml'}
          skip_dirs = {'.git'}
          for path in Path('.').rglob('*'):
              if any(part in skip_dirs for part in path.parts):
                  continue
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              old_text = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r'\bjustinscarfy\s*\(at\)\s*gmail\s*\(dot\)\s*com\b', new_email, text, flags=re.IGNORECASE)
              text = re.sub(r'\bpujustinscarfyyang\s*\(at\)\s*icloud\s*\(dot\)\s*com\b', new_email, text, flags=re.IGNORECASE)
              if text != old_text:
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Commit updates and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-email-scarfyjustin-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update displayed email address across site"
            git push
          fi
